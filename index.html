<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OpenSeek</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PeerJS Library Added -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #121410;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
    }
    .heading-font {
      font-family: 'Space Grotesk', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .search-input-box {
      border: 2px solid #ea580c;
      background-color: #1a1d17;
    }
    .search-action-btn {
      background-color: #f97316;
      color: #000000;
    }
    .search-action-btn:hover {
      background-color: #ea580c;
      color: #ffffff;
    }
    .suggestion-item:hover {
      background-color: #262a22;
      color: #f97316;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden">

  <!-- Header Section -->
  <header class="w-full bg-[#121410]/90 backdrop-blur-md border-b border-stone-800/60 px-6 py-4 flex justify-between items-center fixed top-0 left-0 z-50">
    <div class="flex items-center gap-3">
      <!-- Back Arrow Button -->
      <button id="backNavBtn" onclick="resetToHome()" class="hidden p-2 rounded-xl bg-[#1a1d17] border border-stone-800 text-stone-300 hover:text-white hover:border-orange-500 transition-all flex items-center justify-center">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>

      <div class="flex items-center gap-3 cursor-pointer" onclick="resetToHome()">
        <div class="w-9 h-9 rounded-xl bg-orange-600 flex items-center justify-center text-black font-black text-lg tracking-tighter shadow-lg shadow-orange-500/20">
          <i data-lucide="globe" class="w-5 h-5 text-black"></i>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Search Container -->
  <main id="main-search-wrapper" class="flex-1 flex flex-col items-center justify-center pt-24 px-4 pb-16 max-w-3xl w-full mx-auto transition-all duration-500">
    
    <!-- Big Logo Area -->
    <div id="big-logo-container" class="text-center mb-6 transition-all duration-500 transform origin-center">
      <div class="flex items-center justify-center gap-3 mb-2">
        <i data-lucide="globe" class="w-12 h-12 text-white"></i>
        <h1 class="heading-font text-5xl md:text-7xl font-extrabold tracking-tighter text-white select-none">
          OpenSeek <span class="text-stone-400 text-2xl md:text-4xl font-normal">.com</span>
        </h1>
      </div>
      <p class="text-sm md:text-base text-stone-400 max-w-md mx-auto mt-3 font-normal leading-relaxed">
        One search index across the — Surface Web, PeerJS P2P, Tor, Gemini,I2P,Gopher and IPFS
      </p>
    </div>

    <!-- Search Box -->
    <div class="w-full flex flex-col relative max-w-2xl">
      <div class="w-full search-input-box rounded-full p-1.5 transition-all duration-200 flex items-center relative z-20 shadow-2xl">
        <input id="searchQueryInput" type="text" autocomplete="off" spellcheck="false" placeholder="Search index or PeerJS site name..." 
               class="w-full bg-transparent text-white border-none outline-none py-2.5 px-6 font-medium text-base placeholder-stone-500" />
        
        <div class="flex items-center pr-1">
          <button id="executeSearchBtn" onclick="triggerSearch()" class="search-action-btn text-sm font-bold active:scale-95 px-6 py-2.5 rounded-full transition-all shadow-md">
            Search
          </button>
        </div>
      </div>

      <!-- Suggestions Dropdown -->
      <div id="suggestionsDropdown" class="absolute top-full left-0 w-full bg-[#1a1d17] border border-stone-800 rounded-2xl mt-2 overflow-hidden shadow-2xl hidden z-50 divide-y divide-stone-800/50">
      </div>
    </div>

    <!-- Live Counter -->
    <p id="indexCountText" class="text-xs font-mono text-stone-500 mt-6">Syncing index nodes...</p>

    <!-- Results Display Section -->
    <section id="searchResultsContainer" class="w-full mt-6 flex flex-col gap-4 hidden"></section>
  </main>

  <!-- IN-APP PEERJS WEBSITE VIEWER OVERLAY -->
  <div id="peerSiteViewer" class="fixed inset-0 z-[100] bg-[#121410] hidden flex-col">
    <!-- Browser Top Bar inside OpenSeek -->
    <div class="h-14 bg-[#1a1d17] border-b border-stone-800 px-4 flex items-center justify-between">
      <div class="flex items-center gap-3 min-w-0">
        <button onclick="closePeerSite()" class="p-2 rounded-lg bg-stone-800 hover:bg-stone-700 text-white flex items-center gap-1 text-xs font-bold">
          <i data-lucide="x" class="w-4 h-4"></i> Close
        </button>
        <div class="flex items-center gap-2 bg-[#121410] border border-stone-800 px-3 py-1.5 rounded-lg text-xs font-mono text-emerald-400 truncate">
          <i data-lucide="radio" class="w-3.5 h-3.5 animate-pulse"></i>
          <span id="viewerUrlBar">openseek://loading...</span>
        </div>
      </div>
      <span class="text-[10px] font-mono uppercase px-2 py-1 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 hidden sm:inline">
        P2P
      </span>
    </div>

    <!-- Loading Indicator -->
    <div id="viewerLoading" class="flex-1 flex flex-col items-center justify-center text-center p-6">
      <div class="w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-sm font-mono text-stone-300" id="viewerStatusText">Connecting to Peer host...</p>
    </div>

    <!-- Sandboxed Website Iframe -->
    <iframe id="peerSiteFrame" class="w-full flex-1 bg-white border-none hidden" sandbox="allow-scripts allow-forms allow-modals"></iframe>
  </div>

  <!-- Footer -->
  <footer class="w-full border-t border-stone-900 bg-[#121410] py-4 px-6 text-center text-xs font-mono text-stone-500 flex justify-center">
    <span>OpenSeek is a modified version of SURFFER search engine</span>
  </footer>

  <script>
    let BLOGGER_DB = [];
    const BLOG_URL = "https://simple-index.blogspot.com";
    let clientPeer = null;
    
    const queryInput = document.getElementById('searchQueryInput');
    const resultsContainer = document.getElementById('searchResultsContainer');
    const bigLogoContainer = document.getElementById('big-logo-container');
    const mainWrapper = document.getElementById('main-search-wrapper');
    const suggestionsDropdown = document.getElementById('suggestionsDropdown');
    const indexCountText = document.getElementById('indexCountText');
    const backNavBtn = document.getElementById('backNavBtn');

    function initClientPeer() {
      clientPeer = new Peer();
    }

    function updateUiMetrics(totalCount) {
      if (indexCountText) {
        indexCountText.innerText = `${totalCount} sites in the index + PeerJS P2P enabled.`;
      }
    }

    function extractPureUrl(payload) {
      if (!payload) return "";
      let div = document.createElement('div');
      div.innerHTML = payload;
      
      let firstAnchor = div.querySelector('a');
      if (firstAnchor && firstAnchor.href) {
        let hrefVal = firstAnchor.getAttribute('href').trim();
        if (hrefVal.startsWith('http') && !hrefVal.includes('blogger.com')) return hrefVal;
      }

      let rawText = div.textContent || div.innerText || payload;
      rawText = rawText.trim();
      const urlRegex = /(https?:\/\/[^\s<]+)/g;
      const match = rawText.match(urlRegex);
      return match && match[0] ? match[0].trim() : (rawText.startsWith('http') ? rawText.split(/[\s\n]/)[0] : 'https://' + rawText.split(/[\s\n]/)[0]);
    }

    function fetchAllBloggerPosts(startIndex = 1) {
      const maxResults = 150;
      const oldScript = document.getElementById('bloggerScriptTag');
      if (oldScript) oldScript.remove();

      const scriptNode = document.createElement('script');
      scriptNode.id = 'bloggerScriptTag';
      scriptNode.src = `${BLOG_URL}/feeds/posts/default?alt=json-in-script&callback=processBloggerData&max-results=${maxResults}&start-index=${startIndex}`;
      
      scriptNode.onerror = function() {
        if(indexCountText) indexCountText.innerText = "Index sync finished (PeerJS Ready).";
        checkUrlParameters();
      };

      document.body.appendChild(scriptNode);
    }

    window.processBloggerData = function(data) {
      if (data && data.feed && data.feed.entry) {
        const fetchedEntries = data.feed.entry.map((entry) => {
          let rawContent = entry.content ? entry.content.$t : (entry.summary ? entry.summary.$t : "");
          let targetDirectUrl = extractPureUrl(rawContent);
          let cleanContent = rawContent.replace(/<[^>]*>?/gm, '').trim();
          
          return {
            title: entry.title.$t,
            directUrl: targetDirectUrl, 
            displayUrl: targetDirectUrl.replace(/^(^\w+:|^)\/\//, '').split('/')[0],
            snippet: cleanContent.length > 140 ? cleanContent.substring(0, 140) + "..." : cleanContent
          };
        });

        BLOGGER_DB = BLOGGER_DB.concat(fetchedEntries);
        updateUiMetrics(BLOGGER_DB.length);

        const totalResults = parseInt(data.feed.openSearch$totalResults.$t, 10);
        const nextIndex = BLOGGER_DB.length + 1;

        if (nextIndex <= totalResults) {
          fetchAllBloggerPosts(nextIndex);
        } else {
          checkUrlParameters();
        }
      } else {
        updateUiMetrics(BLOGGER_DB.length);
        checkUrlParameters();
      }
    };

    function checkUrlParameters() {
      const urlParams = new URLSearchParams(window.location.search);
      const queryParam = urlParams.get('q');
      if (queryParam) {
        queryInput.value = decodeURIComponent(queryParam);
        triggerSearch();
      }
    }

    async function renderCombinedSuggestions(query) {
      suggestionsDropdown.innerHTML = '';
      
      if (!query) {
        suggestionsDropdown.classList.add('hidden');
        return;
      }

      let suggestionList = [];

      const cleanPeerName = query.toLowerCase().replace(/[^a-z0-9-]/g, '');
      if (cleanPeerName) {
        suggestionList.push({
          title: cleanPeerName,
          subText: `openseek://${cleanPeerName}`,
          type: 'peer'
        });
      }

      const localMatches = BLOGGER_DB.filter(post => 
        post.title.toLowerCase().includes(query) || post.displayUrl.toLowerCase().includes(query)
      ).slice(0, 3);

      localMatches.forEach(node => {
        suggestionList.push({
          title: node.title,
          subText: node.displayUrl,
          type: 'index'
        });
      });

      try {
        const wikiUrl = `https://en.wikipedia.org/w/api.php?action=opensearch&format=json&origin=*&search=${encodeURIComponent(query)}&limit=3`;
        const res = await fetch(wikiUrl);
        const wikiData = await res.json();
        
        if (wikiData && wikiData[1]) {
          wikiData[1].forEach((title) => {
            if (!suggestionList.some(item => item.title.toLowerCase() === title.toLowerCase())) {
              suggestionList.push({
                title: title,
                subText: 'Wikipedia Search',
                type: 'wiki'
              });
            }
          });
        }
      } catch (err) {}

      if (suggestionList.length === 0) {
        suggestionsDropdown.classList.add('hidden');
        return;
      }

      suggestionList.forEach(item => {
        const itemNode = document.createElement('div');
        itemNode.className = "suggestion-item px-5 py-3 cursor-pointer text-stone-300 flex items-center justify-between transition-colors text-sm font-medium";
        
        let badgeColor = 'text-blue-400 bg-blue-500/10';
        let iconName = 'book-open';
        let labelText = 'Wiki';

        if (item.type === 'index') {
          badgeColor = 'text-orange-400 bg-orange-500/10';
          iconName = 'search';
          labelText = 'Index';
        } else if (item.type === 'peer') {
          badgeColor = 'text-emerald-400 bg-emerald-500/10';
          iconName = 'radio';
          labelText = 'P2P';
        }
        
        itemNode.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            <i data-lucide="${iconName}" class="w-4 h-4 text-stone-500 flex-shrink-0"></i> 
            <span class="truncate text-white font-semibold">${item.title}</span>
            <span class="truncate text-stone-500 text-xs opacity-80">(${item.subText})</span>
          </div>
          <span class="text-[10px] uppercase font-mono tracking-wider font-bold px-2 py-0.5 rounded border border-stone-800 ${badgeColor}">
            ${labelText}
          </span>
        `;
        
        itemNode.addEventListener('click', () => {
          queryInput.value = item.title;
          suggestionsDropdown.classList.add('hidden');
          if (item.type === 'peer') {
            openPeerSite(item.title);
          } else {
            triggerSearch();
          }
        });
        
        suggestionsDropdown.appendChild(itemNode);
      });

      if(window.lucide) lucide.createIcons();
      suggestionsDropdown.classList.remove('hidden');
    }

    queryInput.addEventListener('keypress', (e) => { 
      if (e.key === 'Enter') {
        suggestionsDropdown.classList.add('hidden');
        triggerSearch(); 
      }
    });

    queryInput.addEventListener('input', () => {
      const val = queryInput.value.trim().toLowerCase();
      if (!val) {
        resetToHome();
        return;
      }
      renderCombinedSuggestions(val);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#searchQueryInput') && !e.target.closest('#suggestionsDropdown')) {
        suggestionsDropdown.classList.add('hidden');
      }
    });

    function triggerSearch() {
      const queryStr = queryInput.value.trim();
      if (!queryStr) { resetToHome(); return; }

      suggestionsDropdown.classList.add('hidden');
      bigLogoContainer.classList.add('scale-75', '-translate-y-4', 'opacity-0', 'h-0', 'mb-0', 'overflow-hidden');
      mainWrapper.classList.remove('justify-center');
      mainWrapper.classList.add('pt-24');

      backNavBtn.classList.remove('hidden');

      const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?q=' + encodeURIComponent(queryStr);
      window.history.pushState({path:newUrl}, '', newUrl);

      const matches = BLOGGER_DB.filter(post => 
        post.title.toLowerCase().includes(queryStr.toLowerCase()) || 
        post.snippet.toLowerCase().includes(queryStr.toLowerCase()) ||
        post.displayUrl.toLowerCase().includes(queryStr.toLowerCase())
      );
      renderResults(matches, queryStr);
    }

    async function renderResults(results, rawQuery) {
      resultsContainer.innerHTML = '';
      resultsContainer.classList.remove('hidden');

      let combinedItemsHtml = '';

      const cleanPeerName = rawQuery.toLowerCase().replace(/[^a-z0-9-]/g, '');
      if (cleanPeerName) {
        combinedItemsHtml += `
          <div onclick="openPeerSite('${cleanPeerName}')" class="cursor-pointer group flex flex-col text-left bg-[#1a1d17] hover:bg-[#22261e] p-5 rounded-2xl border-2 border-emerald-500/40 hover:border-emerald-400 transition-all duration-200 shadow-lg shadow-emerald-950/20">
            <div class="flex items-center justify-between mb-1.5">
              <div class="flex items-center gap-2 text-stone-400 font-mono text-xs truncate">
                <span class="text-emerald-400 font-bold tracking-wider text-[10px] uppercase bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/30 flex items-center gap-1">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> P2P Node
                </span>
                <span class="truncate opacity-80">openseek://${cleanPeerName}</span>
              </div>
              <span class="text-xs font-mono text-emerald-400 group-hover:translate-x-1 transition-transform">Launch In-App →</span>
            </div>
            
            <h3 class="heading-font font-bold tracking-wide text-xl text-emerald-400 group-hover:text-emerald-300 transition-colors">
              ${cleanPeerName} — OpenSeek Hosted Website
            </h3>
            
            <p class="text-sm text-stone-300 font-normal mt-2 leading-relaxed">
              Click this card to load "${cleanPeerName}" directly inside OpenSeek via PeerJS.
            </p>
          </div>
        `;
      }

      if (results.length > 0) {
        results.forEach(node => {
          combinedItemsHtml += `
            <div class="group flex flex-col text-left bg-[#1a1d17]/80 hover:bg-[#1a1d17] p-5 rounded-2xl border border-stone-800/80 hover:border-orange-500/50 transition-all duration-200">
              <div class="flex items-center gap-2 text-stone-400 mb-1.5 font-mono text-xs truncate">
                <span class="text-orange-400 font-bold tracking-wider text-[10px] uppercase bg-orange-500/10 px-2 py-0.5 rounded border border-orange-500/20">Human Curated</span>
                <span class="truncate opacity-80">${node.displayUrl}</span>
              </div>
              
              <a href="${node.directUrl}" target="_blank" rel="noopener noreferrer" class="heading-font font-bold tracking-wide text-xl text-orange-400 group-hover:text-orange-300 transition-colors inline-block outline-none">
                ${node.title}
              </a>
              
              <p class="text-sm text-stone-300 font-normal mt-2 leading-relaxed">
                ${node.snippet || 'Verified node indexed from database.'}
              </p>
            </div>
          `;
        });
      }

      try {
        const wikiApiUrl = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gtegeneratorsearch=${encodeURIComponent(rawQuery)}&gsrsearch=${encodeURIComponent(rawQuery)}&gsrlimit=3&prop=extracts|pageimages&exintro=1&explaintext=1&exsentences=2&piprop=thumbnail&pithumbsize=300&utf8=&format=json&origin=*`;
        const wikiRes = await fetch(wikiApiUrl);
        const wikiJson = await wikiRes.json();

        if (wikiJson.query && wikiJson.query.pages) {
          const pages = Object.values(wikiJson.query.pages);
          pages.forEach(wItem => {
            const cleanSnippet = wItem.extract || '';
            const wikiPageUrl = `https://en.wikipedia.org/wiki/${encodeURIComponent(wItem.title.replace(/ /g, '_'))}`;
            const imgUrl = wItem.thumbnail ? wItem.thumbnail.source : null;

            combinedItemsHtml += `
              <div class="group flex flex-col md:flex-row gap-4 text-left bg-[#1a1d17]/80 hover:bg-[#1a1d17] p-5 rounded-2xl border border-stone-800/80 hover:border-blue-500/50 transition-all duration-200">
                ${imgUrl ? `
                  <div class="w-full md:w-32 h-32 flex-shrink-0 rounded-xl overflow-hidden bg-stone-900 border border-stone-800">
                    <img src="${imgUrl}" alt="${wItem.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                  </div>
                ` : ''}
                
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 text-stone-400 mb-1.5 font-mono text-xs truncate">
                    <span class="text-blue-400 font-bold tracking-wider text-[10px] uppercase bg-blue-500/10 px-2 py-0.5 rounded border border-blue-500/20">Wikipedia Article</span>
                    <span class="truncate opacity-80">en.wikipedia.org</span>
                  </div>
                  
                  <a href="${wikiPageUrl}" target="_blank" rel="noopener noreferrer" class="heading-font font-bold tracking-wide text-xl text-blue-400 group-hover:text-blue-300 transition-colors inline-block outline-none">
                    ${wItem.title}
                  </a>
                  
                  <p class="text-sm text-stone-300 font-normal mt-2 leading-relaxed">
                    ${cleanSnippet}
                  </p>
                </div>
              </div>
            `;
          });
        }
      } catch (err) {}

      const encodedQuery = encodeURIComponent(rawQuery);

      combinedItemsHtml += `
        <div class="group flex flex-col text-left bg-[#1a1d17]/80 hover:bg-[#1a1d17] p-5 rounded-2xl border border-stone-800/80 hover:border-red-500/50 transition-all duration-200">
          <div class="flex items-center gap-2 text-stone-400 mb-1.5 font-mono text-xs truncate">
            <span class="text-red-500 font-bold tracking-wider text-[10px] uppercase bg-red-500/10 px-2 py-0.5 rounded border border-red-500/20">YouTube Search</span>
            <span class="truncate opacity-80">youtube.com</span>
          </div>
          <a href="https://www.youtube.com/results?search_query=${encodedQuery}" target="_blank" rel="noopener noreferrer" class="heading-font font-bold tracking-wide text-xl text-red-500 group-hover:text-red-400 transition-colors inline-block outline-none">
            Watch videos about "${rawQuery}" on YouTube
          </a>
          <p class="text-sm text-stone-300 font-normal mt-2 leading-relaxed">
            Click here to explore video tutorials, discussions, and content related to "${rawQuery}" on YouTube.
          </p>
        </div>
      `;

      resultsContainer.innerHTML = combinedItemsHtml;
      if(window.lucide) lucide.createIcons();
    }

    function openPeerSite(siteName) {
      const viewer = document.getElementById('peerSiteViewer');
      const urlBar = document.getElementById('viewerUrlBar');
      const loading = document.getElementById('viewerLoading');
      const statusText = document.getElementById('viewerStatusText');
      const frame = document.getElementById('peerSiteFrame');

      viewer.classList.remove('hidden');
      viewer.classList.add('flex');
      loading.classList.remove('hidden');
      frame.classList.add('hidden');
      urlBar.innerText = `openseek://${siteName}`;
      statusText.innerText = `Connecting to "${siteName}" via P2P...`;

      if (!clientPeer || clientPeer.destroyed) {
        clientPeer = new Peer();
      }

      const targetPeerId = "openseek-site-" + siteName;
      let connectionResolved = false;

      const timeoutTimer = setTimeout(() => {
        if (!connectionResolved) {
          statusText.innerHTML = `<span class="text-red-400">Error: Website "${siteName}" is offline or does not exist.</span><br><span class="text-xs text-stone-500 mt-2 block">Make sure the publisher page is active and hosting this site.</span>`;
        }
      }, 7000);

      const conn = clientPeer.connect(targetPeerId);

      conn.on('open', () => {
        statusText.innerText = "Connected! Downloading website HTML...";
      });

      conn.on('data', (data) => {
        if (data && data.type === 'SITE_PAYLOAD') {
          connectionResolved = true;
          clearTimeout(timeoutTimer);

          loading.classList.add('hidden');
          frame.classList.remove('hidden');
          frame.srcdoc = data.html;
        }
      });

      conn.on('error', () => {
        clearTimeout(timeoutTimer);
        statusText.innerHTML = `<span class="text-red-400">Connection failed. Host unreachable.</span>`;
      });

      if(window.lucide) lucide.createIcons();
    }

    function closePeerSite() {
      const viewer = document.getElementById('peerSiteViewer');
      const frame = document.getElementById('peerSiteFrame');
      viewer.classList.add('hidden');
      viewer.classList.remove('flex');
      frame.srcdoc = "";
    }

    function resetToHome() {
      queryInput.value = '';
      suggestionsDropdown.classList.add('hidden');
      resultsContainer.classList.add('hidden');
      backNavBtn.classList.add('hidden');
      
      bigLogoContainer.classList.remove('scale-75', '-translate-y-4', 'opacity-0', 'h-0', 'mb-0', 'overflow-hidden');
      mainWrapper.classList.add('justify-center');
      mainWrapper.classList.remove('pt-24');
      
      const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
      window.history.pushState({path:cleanUrl}, '', cleanUrl);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initClientPeer();
      fetchAllBloggerPosts(1);
      if(window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
